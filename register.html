<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký | FJ COMPUTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 80% 20%, rgba(255,107,53,0.15) 0%, transparent 50%),
                        radial-gradient(circle at 20% 80%, rgba(247,147,30,0.1) 0%, transparent 50%);
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 40px,
                rgba(255,107,53,0.03) 40px,
                rgba(255,107,53,0.03) 80px
            );
            animation: moveBg 20s linear infinite reverse;
        }

        @keyframes moveBg {
            0% { transform: translate(0, 0); }
            100% { transform: translate(80px, 80px); }
        }

        /* Floating Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: #ff6b35;
            top: -100px;
            right: -100px;
            animation: floatOrb 15s ease-in-out infinite;
        }

        .orb-2 {
            width: 250px;
            height: 250px;
            background: #f7931e;
            bottom: -80px;
            left: -80px;
            animation: floatOrb 12s ease-in-out infinite reverse;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }

        /* Register Card */
        .register-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            padding: 1.5rem;
        }

        .register-card {
            background: rgba(10, 15, 26, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 2.5rem;
            border: 1px solid rgba(255,107,53,0.3);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,107,53,0.1);
            transition: transform 0.3s ease;
        }

        .register-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,107,53,0.6);
            box-shadow: 0 30px 60px rgba(255,107,53,0.2);
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            font-size: 48px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .logo-sub {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            text-align: center;
            margin-top: 0.5rem;
        }

        /* Title */
        .title {
            text-align: center;
            margin-bottom: 2rem;
        }

        .title h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.5rem;
        }

        .title p {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
        }

        /* Form */
        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-label {
            display: block;
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 18px;
        }

        .input-field {
            width: 100%;
            padding: 1rem 1rem 1rem 48px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
        }

        .input-field:focus {
            outline: none;
            border-color: #ff6b35;
            background: rgba(255,107,53,0.1);
            box-shadow: 0 0 15px rgba(255,107,53,0.2);
        }

        .input-field::placeholder {
            color: rgba(255,255,255,0.3);
        }

        /* Password Strength */
        .password-strength {
            margin-top: 0.5rem;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .strength-bar {
            width: 0%;
            height: 100%;
            transition: width 0.3s, background 0.3s;
        }

        .strength-text {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.5);
            margin-top: 0.3rem;
            display: inline-block;
        }

        /* Terms */
        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 1.5rem;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
        }

        .terms input {
            margin-top: 2px;
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #ff6b35;
        }

        .terms a {
            color: #ff6b35;
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        /* Button */
        .register-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 1.5rem;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,107,35,0.4);
        }

        /* Separator */
        .separator {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            color: rgba(255,255,255,0.3);
            font-size: 0.8rem;
        }

        .separator-line {
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }

        /* Login Link */
        .login-link {
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
        }

        .login-link a {
            color: #ff6b35;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Back to Home */
        .back-home {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-home a {
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .back-home a:hover {
            color: #ff6b35;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #1a1a2e, #0a0a15);
            border-left: 4px solid #ff6b35;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            z-index: 1000;
            color: white;
            font-size: 0.9rem;
            animation: slideInRight 0.3s ease;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 550px) {
            .register-card {
                padding: 1.8rem;
            }
            .title h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="register-container">
        <div class="register-card">
            <div class="logo">
                <i class="fas fa-microchip logo-icon"></i>
                <div class="logo-text">FJ COMPUTER</div>
                <div class="logo-sub">Join the Ultimate Gaming Community</div>
            </div>

            <div class="title">
                <h1>Create Account 🚀</h1>
                <p>Start your premium gaming experience today</p>
            </div>

            <form id="registerForm" onsubmit="event.preventDefault(); handleRegister();">
                <div class="input-group">
                    <label class="input-label">Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="regUsername" class="input-field" placeholder="Choose a username" required>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="regEmail" class="input-field" placeholder="your@email.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="regPassword" class="input-field" placeholder="Create a strong password" required oninput="checkPasswordStrength()">
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <span class="strength-text" id="strengthText"></span>
                </div>

                <div class="input-group">
                    <label class="input-label">Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-check-circle input-icon"></i>
                        <input type="password" id="regConfirmPassword" class="input-field" placeholder="Confirm your password" required>
                    </div>
                </div>

                <div class="terms">
                    <input type="checkbox" id="termsCheckbox" required>
                    <label for="termsCheckbox">
                        I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="register-btn">
                    <i class="fas fa-user-plus" style="margin-right: 8px;"></i> Create Account
                </button>
            </form>

            <div class="separator">
                <div class="separator-line"></div>
                <span>or</span>
                <div class="separator-line"></div>
            </div>

            <div class="login-link">
                Already have an account? <a href="login.html">Sign In →</a>
            </div>

            <div class="back-home">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = 'toast';
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            toast.innerHTML = `<i class="fas ${icon}" style="margin-right: 10px; color: #ff6b35;"></i>${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function checkPasswordStrength() {
            const password = document.getElementById('regPassword').value;
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');
            
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            const percentage = (strength / 5) * 100;
            bar.style.width = percentage + '%';
            
            if (strength <= 1) {
                bar.style.background = '#ff4444';
                text.textContent = 'Weak password';
                text.style.color = '#ff4444';
            } else if (strength <= 3) {
                bar.style.background = '#ffaa44';
                text.textContent = 'Medium password';
                text.style.color = '#ffaa44';
            } else {
                bar.style.background = '#00cc66';
                text.textContent = 'Strong password!';
                text.style.color = '#00cc66';
            }
            
            if (password.length === 0) {
                bar.style.width = '0%';
                text.textContent = '';
            }
        }

        async function handleRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirmPassword').value;
            const termsChecked = document.getElementById('termsCheckbox').checked;

            if (!username || !email || !password || !confirm) {
                showToast('Please fill in all fields!', 'error');
                return;
            }

            if (password !== confirm) {
                showToast('Passwords do not match!', 'error');
                return;
            }

            if (password.length < 6) {
                showToast('Password must be at least 6 characters!', 'error');
                return;
            }

            if (!termsChecked) {
                showToast('Please agree to the Terms of Service!', 'error');
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                showToast('Please enter a valid email address!', 'error');
                return;
            }

            // Get existing users
            const users = JSON.parse(localStorage.getItem('fj_users') || '[]');
            
            // Check if user exists
            if (users.find(u => u.username === username)) {
                showToast('Username already exists!', 'error');
                return;
            }
            
            if (users.find(u => u.email === email)) {
                showToast('Email already registered!', 'error');
                return;
            }

            // Create new user
            const newUser = {
                username: username,
                email: email,
                password: password,
                createdAt: new Date().toISOString(),
                loyaltyPoints: 0,
                orders: [],
                cart: [],
                avatarType: 'default'
            };
            
            users.push(newUser);
            localStorage.setItem('fj_users', JSON.stringify(users));
            
            showToast('Registration successful! Redirecting to login...', 'success');
            
            // Redirect to login page after 1.5 seconds
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        }

        // Real-time password match check
        document.getElementById('regConfirmPassword').addEventListener('input', function() {
            const pwd = document.getElementById('regPassword').value;
            const confirm = this.value;
            const strengthText = document.getElementById('strengthText');
            
            if (confirm.length > 0 && pwd !== confirm) {
                strengthText.textContent = '✗ Passwords do not match';
                strengthText.style.color = '#ff4444';
            } else if (confirm.length > 0 && pwd === confirm) {
                if (strengthText.textContent !== '') {
                    strengthText.textContent = '✓ Passwords match';
                    strengthText.style.color = '#00cc66';
                    setTimeout(() => {
                        if (document.getElementById('regPassword').value.length > 0) {
                            checkPasswordStrength();
                        }
                    }, 1500);
                }
            } else if (pwd.length > 0) {
                checkPasswordStrength();
            }
        });
    </script>
</body>
</html>
