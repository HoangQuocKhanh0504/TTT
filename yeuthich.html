<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yêu Thích | FJ COMPUTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #0a0a0f;
            color: #fff;
            overflow-x: hidden;
        }

        .navbar {
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            padding: 0.8rem 2rem;
            border-bottom: 1px solid rgba(255,107,35,0.3);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: #ff6b35;
        }

        .avatar-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border: 2px solid rgba(255,255,255,0.3);
            transition: 0.3s;
        }

        .avatar-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255,107,35,0.4);
        }

        .page-header {
            background: linear-gradient(135deg, #0f0f1a, #050508);
            padding: 2rem 2rem;
            text-align: center;
            border-bottom: 1px solid rgba(255,107,35,0.2);
        }

        .page-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .page-header h1 span {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .page-header p {
            color: rgba(255,255,255,0.5);
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .wishlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .wishlist-count {
            background: rgba(255,255,255,0.05);
            padding: 0.5rem 1rem;
            border-radius: 30px;
            font-size: 0.9rem;
        }

        .wishlist-count span {
            color: #ff6b35;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .clear-all-btn {
            padding: 0.5rem 1.2rem;
            background: rgba(255,68,68,0.15);
            border: 1px solid rgba(255,68,68,0.3);
            border-radius: 30px;
            color: #ff4444;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.85rem;
        }

        .clear-all-btn:hover {
            background: rgba(255,68,68,0.3);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s;
            border: 1px solid rgba(255,107,53,0.15);
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #ff6b35;
            box-shadow: 0 10px 30px rgba(255,107,53,0.15);
        }

        .remove-wishlist {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            z-index: 2;
        }

        .remove-wishlist:hover {
            background: #ff4444;
            transform: scale(1.1);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            cursor: pointer;
        }

        .product-info {
            padding: 1rem;
        }

        .product-name {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
            cursor: pointer;
        }

        .product-name:hover {
            color: #ff6b35;
        }

        .product-specs {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .product-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ff6b35;
            margin: 0.5rem 0;
        }

        .product-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .add-to-cart-btn {
            flex: 1;
            padding: 0.6rem;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.8rem;
        }

        .add-to-cart-btn:hover {
            transform: scale(1.02);
        }

        .empty-state {
            text-align: center;
            padding: 4rem;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
        }

        .empty-state i {
            font-size: 64px;
            color: rgba(255,255,255,0.2);
            margin-bottom: 1rem;
        }

        .empty-state p {
            color: rgba(255,255,255,0.5);
            margin-bottom: 1rem;
        }

        .shop-link {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border-radius: 40px;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1a1a2e;
            border-left: 4px solid #ff6b35;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            z-index: 2100;
            color: white;
            animation: slideInRight 0.3s;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: rgba(255,255,255,0.4);
            border-top: 1px solid rgba(255,107,53,0.1);
            margin-top: 2rem;
        }

        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fas fa-microchip"></i> FJ COMPUTER</a>
            <div class="nav-links">
                <a href="index.html">TRANG CHỦ</a>
                <a href="sanpham.html">SẢN PHẨM</a>
                <a href="thanhvien.html">THÀNH VIÊN</a>
                <a href="lienhe.html">LIÊN HỆ</a>
                <div class="avatar-btn" id="avatarBtn" onclick="window.location.href='index.html'">
                    <span id="avatarText">👤</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="page-header">
        <h1>❤️ <span>Sản Phẩm Yêu Thích</span></h1>
        <p>Những sản phẩm bạn đã lưu để mua sau</p>
    </div>

    <div class="main-container">
        <div class="wishlist-header">
            <div class="wishlist-count">📦 <span id="wishlistCount">0</span> sản phẩm yêu thích</div>
            <button class="clear-all-btn" onclick="clearAllWishlist()"><i class="fas fa-trash-alt"></i> Xóa tất cả</button>
        </div>

        <div id="wishlistContainer" class="products-grid"></div>
    </div>

    <footer>
        <p>© 2025 FJ COMPUTER - Địa chỉ tin cậy cho game thủ Việt</p>
    </footer>

    <script>
        const productsDB = [
            { id: 1, name: "ASUS ROG Strix G18", price: 69990000, image: "https://images.unsplash.com/photo-1588872657578-7efd1f4ae8cf?w=400", specs: "Intel i9-13980HX | RTX 4090 | 32GB DDR5" },
            { id: 2, name: "MSI Titan GT77 HX", price: 89990000, image: "https://images.unsplash.com/photo-1593642702821-c8da6771f0b6?w=400", specs: "Intel i9-13980HX | RTX 4090 | 64GB DDR5" },
            { id: 3, name: "FJ Titan X9", price: 65990000, image: "https://images.unsplash.com/photo-1587202372775-e229f172b9d7?w=400", specs: "Intel i9-14900K | RTX 4090 | 64GB DDR5" },
            { id: 4, name: "FJ Phantom G5", price: 45990000, image: "https://images.unsplash.com/photo-1591799264318-7e6ef8ddb7ea?w=400", specs: "Intel i7-14700K | RTX 4080 | 32GB DDR5" }
        ];

        let currentUser = null;
        let wishlist = [];

        function loadUser() {
            const saved = localStorage.getItem('currentUser');
            if (saved) {
                try {
                    currentUser = JSON.parse(saved);
                    const avatarSpan = document.getElementById('avatarText');
                    if (avatarSpan) avatarSpan.innerHTML = currentUser.username.charAt(0).toUpperCase();
                    wishlist = currentUser.wishlist || [];
                    displayWishlist();
                } catch(e) { console.error(e); }
            } else {
                document.getElementById('wishlistContainer').innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1;">
                        <i class="fas fa-lock"></i>
                        <p>Vui lòng đăng nhập để xem danh sách yêu thích</p>
                        <a href="index.html" class="shop-link">Đăng nhập ngay</a>
                    </div>
                `;
                document.querySelector('.wishlist-header').style.display = 'none';
            }
        }

        function displayWishlist() {
            const container = document.getElementById('wishlistContainer');
            document.getElementById('wishlistCount').innerText = wishlist.length;

            if (wishlist.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1;">
                        <i class="fas fa-heart-broken"></i>
                        <p>Bạn chưa có sản phẩm yêu thích nào</p>
                        <a href="sanpham.html" class="shop-link">Khám phá sản phẩm</a>
                    </div>
                `;
                return;
            }

            const wishlistProducts = wishlist.map(id => productsDB.find(p => p.id === id)).filter(p => p);
            
            container.innerHTML = wishlistProducts.map(product => `
                <div class="product-card">
                    <div class="remove-wishlist" onclick="removeFromWishlist(${product.id})">
                        <i class="fas fa-times" style="color:white;font-size:14px;"></i>
                    </div>
                    <img src="${product.image}" class="product-image" onclick="viewProduct(${product.id})">
                    <div class="product-info">
                        <div class="product-name" onclick="viewProduct(${product.id})">${product.name}</div>
                        <div class="product-specs">${product.specs.substring(0, 50)}...</div>
                        <div class="product-price">${product.price.toLocaleString('vi-VN')}đ</div>
                        <div class="product-actions">
                            <button class="add-to-cart-btn" onclick="addToCart(${product.id})"><i class="fas fa-cart-plus"></i> Thêm vào giỏ</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = productsDB.find(p => p.id === productId);
            if (!product) return;
            let cart = JSON.parse(localStorage.getItem('checkoutCart') || '[]');
            const existing = cart.find(item => item.id === productId);
            if (existing) existing.quantity = (existing.quantity || 1) + 1;
            else cart.push({ ...product, quantity: 1 });
            localStorage.setItem('checkoutCart', JSON.stringify(cart));
            showToast(`Đã thêm ${product.name} vào giỏ hàng!`, 'success');
        }

        function removeFromWishlist(productId) {
            wishlist = wishlist.filter(id => id !== productId);
            if (currentUser) {
                currentUser.wishlist = wishlist;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                const users = JSON.parse(localStorage.getItem('fj_users') || '[]');
                const idx = users.findIndex(u => u.username === currentUser.username);
                if (idx !== -1) { users[idx].wishlist = wishlist; localStorage.setItem('fj_users', JSON.stringify(users)); }
            }
            displayWishlist();
            showToast('Đã xóa khỏi danh sách yêu thích!', 'success');
        }

        function clearAllWishlist() {
            if (confirm('Bạn có chắc muốn xóa tất cả sản phẩm yêu thích?')) {
                wishlist = [];
                if (currentUser) {
                    currentUser.wishlist = wishlist;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    const users = JSON.parse(localStorage.getItem('fj_users') || '[]');
                    const idx = users.findIndex(u => u.username === currentUser.username);
                    if (idx !== -1) { users[idx].wishlist = wishlist; localStorage.setItem('fj_users', JSON.stringify(users)); }
                }
                displayWishlist();
                showToast('Đã xóa tất cả sản phẩm yêu thích!', 'success');
            }
        }

        function viewProduct(id) {
            showToast('Xem chi tiết sản phẩm tại trang sản phẩm', 'info');
            setTimeout(() => window.location.href = 'sanpham.html', 1000);
        }

        function showToast(msg, type) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}" style="margin-right:10px;color:#ff6b35;"></i>${msg}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        loadUser();
    </script>
</body>
</html>
