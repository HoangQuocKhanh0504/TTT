<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập | FJ COMPUTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 20% 50%, rgba(255,107,53,0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(247,147,30,0.1) 0%, transparent 50%);
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 40px,
                rgba(255,107,53,0.03) 40px,
                rgba(255,107,53,0.03) 80px
            );
            animation: moveBg 20s linear infinite;
        }

        @keyframes moveBg {
            0% { transform: translate(0, 0); }
            100% { transform: translate(80px, 80px); }
        }

        /* Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border-radius: 50%;
            opacity: 0.3;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Login Card */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            padding: 1.5rem;
        }

        .login-card {
            background: rgba(10, 15, 26, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 2.5rem;
            border: 1px solid rgba(255,107,53,0.3);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,107,53,0.1);
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,107,53,0.6);
            box-shadow: 0 30px 60px rgba(255,107,53,0.2);
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            font-size: 48px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .logo-sub {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            text-align: center;
            margin-top: 0.5rem;
        }

        /* Title */
        .title {
            text-align: center;
            margin-bottom: 2rem;
        }

        .title h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.5rem;
        }

        .title p {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
        }

        /* Form */
        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-label {
            display: block;
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 18px;
        }

        .input-field {
            width: 100%;
            padding: 1rem 1rem 1rem 48px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
        }

        .input-field:focus {
            outline: none;
            border-color: #ff6b35;
            background: rgba(255,107,53,0.1);
            box-shadow: 0 0 15px rgba(255,107,53,0.2);
        }

        .input-field::placeholder {
            color: rgba(255,255,255,0.3);
        }

        /* Options */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.8rem;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
        }

        .remember input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #ff6b35;
        }

        .forgot {
            color: #ff6b35;
            text-decoration: none;
            transition: 0.3s;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* Button */
        .login-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,107,35,0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* Separator */
        .separator {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            color: rgba(255,255,255,0.3);
            font-size: 0.8rem;
        }

        .separator-line {
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }

        /* Register Link */
        .register-link {
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
        }

        .register-link a {
            color: #ff6b35;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* Back to Home */
        .back-home {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-home a {
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .back-home a:hover {
            color: #ff6b35;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #1a1a2e, #0a0a15);
            border-left: 4px solid #ff6b35;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            z-index: 1000;
            color: white;
            font-size: 0.9rem;
            animation: slideInRight 0.3s ease;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 500px) {
            .login-card {
                padding: 1.8rem;
            }
            .title h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="particles" id="particles"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <i class="fas fa-microchip logo-icon"></i>
                <div class="logo-text">FJ COMPUTER</div>
                <div class="logo-sub">Ultimate Gaming Experience</div>
            </div>

            <div class="title">
                <h1>Welcome Back! 👋</h1>
                <p>Sign in to continue your gaming journey</p>
            </div>

            <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
                <div class="input-group">
                    <label class="input-label">Username / Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="loginUsername" class="input-field" placeholder="Enter your username" required>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="loginPassword" class="input-field" placeholder="Enter your password" required>
                    </div>
                </div>

                <div class="options">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe"> Remember me
                    </label>
                    <a href="#" class="forgot">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i> Sign In
                </button>
            </form>

            <div class="separator">
                <div class="separator-line"></div>
                <span>or</span>
                <div class="separator-line"></div>
            </div>

            <div class="register-link">
                Don't have an account? <a href="register.html">Create Account →</a>
            </div>

            <div class="back-home">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 4 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = Math.random() * 10 + 5 + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(particle);
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = 'toast';
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            toast.innerHTML = `<i class="fas ${icon}" style="margin-right: 10px; color: #ff6b35;"></i>${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        async function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            if (!username || !password) {
                showToast('Please fill in all fields!', 'error');
                return;
            }

            // Simulate API call
            try {
                // Get users from localStorage (for demo)
                const users = JSON.parse(localStorage.getItem('fj_users') || '[]');
                const user = users.find(u => u.username === username && u.password === password);

                if (user) {
                    // Store login session
                    const session = {
                        username: user.username,
                        email: user.email,
                        loginTime: new Date().toISOString(),
                        cart: user.cart || []
                    };
                    
                    if (rememberMe) {
                        localStorage.setItem('currentUser', JSON.stringify(session));
                    } else {
                        sessionStorage.setItem('currentUser', JSON.stringify(session));
                    }
                    
                    showToast('Login successful! Redirecting...', 'success');
                    
                    // Redirect to home page after 1 second
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showToast('Invalid username or password!', 'error');
                }
            } catch (error) {
                showToast('Login failed! Please try again.', 'error');
            }
        }

        // Auto fill remember me
        function loadSavedUser() {
            const saved = localStorage.getItem('currentUser');
            if (saved) {
                try {
                    const user = JSON.parse(saved);
                    document.getElementById('loginUsername').value = user.username;
                    document.getElementById('rememberMe').checked = true;
                } catch(e) {}
            }
        }

        createParticles();
        loadSavedUser();
    </script>
</body>
</html>
